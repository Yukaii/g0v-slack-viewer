<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25252b" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <g id="slack-arm">
      <!-- Horizontal pill -->
      <rect x="52" y="176" width="176" height="60" rx="30" />
      <!-- Companion teardrop dot (bottom-right corner sharp) -->
      <path d="M198 88a30 30 0 0 0-30 30v0a30 30 0 0 0 30 30h30v-30a30 30 0 0 0-30-30z" />
    </g>
  </defs>

  <!-- Rounded dark carbon app tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Slack-inspired 4-quadrant pinwheel (#) -->
  <use href="#slack-arm" fill="#36C5F0" />
  <use href="#slack-arm" fill="#2EB67D" transform="rotate(90 256 256)" />
  <use href="#slack-arm" fill="#ECB22E" transform="rotate(180 256 256)" />
  <use href="#slack-arm" fill="#D91E26" transform="rotate(270 256 256)" />

  <!-- Central g0v emblem cutout + white squircle -->
  <rect
    x="160"
    y="160"
    width="192"
    height="192"
    rx="46"
    fill="#ffffff"
    stroke="#18181b"
    stroke-width="18"
  />

  <!-- Official g0v slashed zero centered at (256, 256) -->
  <g transform="translate(256 256) scale(0.62) translate(-302.5 -126)">
    <path
      fill="#C60000"
      d="M414,2.5h-29.6L191,249.5h30.1L414,2.5z"
    />
    <path
      fill="#111113"
      d="M370.1,89.3c-9.7-9.8-28.4-18.8-69.6-18.8c-39.6,0-59.8,8.8-69.7,18.8c-9,9.1-13.9,20.4-13.9,37.2s4.9,28,13.9,37.1c9.7,9.8,29.3,18.9,69.7,18.9s59.8-8.9,69.6-18.8c9-9.1,13.9-20.4,13.9-37.2C384,109.5,379.1,98.4,370.1,89.3z M300.6,158.5c-26.3,0-40-5.5-45.8-11.3c-4.5-4.6-7.8-10.5-7.8-21.7s2.8-17.2,7.6-22.1c6-6,19.6-10.9,46-10.9s39.5,5,45.7,11.2c4.8,4.9,7.8,10.6,7.8,21.8s-2.8,17.2-7.6,22.1C340.2,153.8,326.9,158.5,300.6,158.5z"
    />
  </g>
</svg>
